name = "oracle-corpus"
description = "Speedometer 3 and JetStream 3 performance with benchmark-oracle AOT corpora versus default execution."
default_iterations = 3
allow_failure = false

[analyze]
benchmark = "analyses/parse_benchmark.py"

[tables.speedometer3]
analysis = "benchmark"
script = "scripts/benchmark_table.py"

[tables.jetstream3]
analysis = "benchmark"
script = "scripts/benchmark_table.py"

[variables]
MACH = "./mach raptor --app firefox --browser-cycles 1 --binary @BIN_AOT --setenv MOZ_HEADLESS=1"
SP3 = "-t speedometer3 --page-cycles 3"
JS3 = "-t jetstream3 --page-cycles 1 --test-url-params 'tag=js&iterationCount=3&worstCaseCount=1'"
AOT = "--setenv JIT_OPTION_useAOTImage=true --setenv JIT_OPTION_aotOnly=true --setenv JIT_OPTION_nativeRegExp=false --setpref javascript.options.ion=false"
RESULT = "cat testing/mozharness/build/raptor.json"

[variants]
speedometer3-default = "@CLEAN_AOT $MACH $SP3      1>&2 && $RESULT"
speedometer3-aot-only = "@CLEAN_AOT $MACH $SP3 $AOT 1>&2 && $RESULT"
# jetstream3-default = "@CLEAN_AOT $MACH $JS3      1>&2 && $RESULT"
# jetstream3-aot-only = "@CLEAN_AOT $MACH $JS3 $AOT 1>&2 && $RESULT"
