name = "7-6-cross-process-memory-sharing"
description = "Speedometer 3 content-process PSS and USS across interpreter, default-JIT, and AmberMonkey configurations."
default_iterations = 3
allow_failure = true

[analyze]
memory = "analyses/parse_memory.py"

[tables.aggregate]
analysis = "memory"
script   = "figures/aggregate_table.py"

[figures.composition-bars]
analysis = "memory"
script   = "figures/composition_bars.py"

[figures.per-proc-pss-lines]
analysis = "memory"
script   = "figures/per_proc_pss_lines.py"

[variables]
INIT               = "D=$(mktemp -d @SCRATCH/amber-7-6.XXXXXX)"
SIDECAR_BIN        = "python3 \"$FOSSIL_PROJECT_DIR/$FOSSIL_NAME/scripts/smaps_sidecar.py\""
SIDECAR_TAIL       = ">\"$D/sidecar.log\" 2>&1 & echo $! > \"$D/sidecar.pid\""
# 2000 ms interval keeps overhead modest while still catching Peak across
# Speedometer's ~1 min run. Content sandbox off so smaps is readable.
SIDECAR_START_REL  = "$SIDECAR_BIN --dir \"$D\" --parent-exe @BIN_RELEASE --poll-ms 50 --interval-ms 2000 $SIDECAR_TAIL"
SIDECAR_START_AOT  = "$SIDECAR_BIN --dir \"$D\" --parent-exe @BIN_AOT     --poll-ms 50 --interval-ms 2000 $SIDECAR_TAIL"
SIDECAR_STOP       = "kill -TERM $(cat \"$D/sidecar.pid\") 2>/dev/null; sleep 1; true"
EMIT               = "python3 \"$FOSSIL_PROJECT_DIR/$FOSSIL_NAME/scripts/emit_summary.py\" \"$D\" && rm -rf \"$D\""

# Strip ambient JIT env so --setenv is authoritative.
CLEAN = "env -u MOZ_HEADLESS -u IONFLAGS -u JIT_OPTION_aotEnforce -u JIT_OPTION_aotOnly -u JIT_OPTION_aotRecordDir -u JIT_OPTION_baselineJit -u JIT_OPTION_disableJitBackend -u JIT_OPTION_ion -u JIT_OPTION_useAOTImage"
MACH_BASE = "./mach raptor -t speedometer3 --app firefox --browser-cycles 1 --page-cycles 3"
# default-no-ion matches aot-corpus's tier profile without AOT.
INTERP_SETENV = "--setenv JIT_OPTION_disableJitBackend=true"

[variants]
interp-only    = "$INIT ; $SIDECAR_START_REL ; cd @FIREFOX && $CLEAN @NO_CONTENT_SANDBOX_ENV @MOZCONFIG_RELEASE $MACH_BASE --binary @BIN_RELEASE $INTERP_SETENV 1>&2 ; $SIDECAR_STOP ; $EMIT"
default        = "$INIT ; $SIDECAR_START_REL ; cd @FIREFOX && $CLEAN @NO_CONTENT_SANDBOX_ENV @MOZCONFIG_RELEASE $MACH_BASE --binary @BIN_RELEASE 1>&2 ; $SIDECAR_STOP ; $EMIT"
default-no-ion = "$INIT ; $SIDECAR_START_REL ; cd @FIREFOX && $CLEAN @NO_CONTENT_SANDBOX_ENV @MOZCONFIG_RELEASE $MACH_BASE --binary @BIN_RELEASE @NO_ION_PREF 1>&2 ; $SIDECAR_STOP ; $EMIT"
aot-corpus     = "$INIT ; $SIDECAR_START_AOT ; cd @FIREFOX && $CLEAN @NO_CONTENT_SANDBOX_ENV @MOZCONFIG_AOT     $MACH_BASE --binary @BIN_AOT     @AOT_ONLY_SETENV @NO_ION_PREF 1>&2 ; $SIDECAR_STOP ; $EMIT"
