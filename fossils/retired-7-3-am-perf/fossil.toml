name = "am-perf"
description = "AmberMonkey held-out performance on Speedometer 3 and JetStream 3: strict AOT vs interpreter-only vs default, under matched Wasm/native-regexp controls."
default_iterations = 1
allow_failure = false

[analyze]
performance = "analyses/parse_performance.py"

[figures.performance]
analysis = "performance"
script   = "figures/performance.py"

[variables]
# Strip ambient JIT env so --setenv is the whole policy. Kept flat: fossil vars are single-pass.
PRE_RELEASE = "cd @FIREFOX && env -u MOZ_HEADLESS -u IONFLAGS -u JIT_OPTION_aotEnforce -u JIT_OPTION_aotOnly -u JIT_OPTION_aotRecordDir -u JIT_OPTION_baselineJit -u JIT_OPTION_disableJitBackend -u JIT_OPTION_ion -u JIT_OPTION_useAOTImage @MC_BROWSER ./mach raptor"
PRE_AOT     = "cd @FIREFOX && env -u MOZ_HEADLESS -u IONFLAGS -u JIT_OPTION_aotEnforce -u JIT_OPTION_aotOnly -u JIT_OPTION_aotRecordDir -u JIT_OPTION_baselineJit -u JIT_OPTION_disableJitBackend -u JIT_OPTION_ion -u JIT_OPTION_useAOTImage @MC_AOT ./mach raptor"
RAPTOR      = "--app firefox --browser-cycles 1 --page-cycles 1 --setenv MOZ_DISABLE_CONTENT_SANDBOX=1 --setenv MOZ_HEADLESS=1 --setpref javascript.options.baselinejit=true --setpref javascript.options.native_regexp=false --setpref javascript.options.wasm=false"
ION_OFF     = "--setpref javascript.options.ion=false"
ION_ON      = "--setpref javascript.options.ion=true"
RESULT      = "cat testing/mozharness/build/raptor.json"

[variants]
speedometer3-interp-only = "$PRE_RELEASE $RAPTOR --binary @BIN_RELEASE $ION_OFF --setenv JIT_OPTION_disableJitBackend=true -t speedometer3 1>&2 && $RESULT"
speedometer3-am-strict   = "$PRE_AOT     $RAPTOR --binary @BIN_AOT     $ION_OFF --setenv JIT_OPTION_useAOTImage=true --setenv JIT_OPTION_aotOnly=true -t speedometer3 1>&2 && $RESULT"
speedometer3-default     = "$PRE_RELEASE $RAPTOR --binary @BIN_RELEASE $ION_ON  -t speedometer3 1>&2 && $RESULT"

jetstream3-interp-only   = "$PRE_RELEASE $RAPTOR --binary @BIN_RELEASE $ION_OFF --setenv JIT_OPTION_disableJitBackend=true -t jetstream3 1>&2 && $RESULT"
jetstream3-am-strict     = "$PRE_AOT     $RAPTOR --binary @BIN_AOT     $ION_OFF --setenv JIT_OPTION_useAOTImage=true --setenv JIT_OPTION_aotOnly=true -t jetstream3 1>&2 && $RESULT"
jetstream3-default       = "$PRE_RELEASE $RAPTOR --binary @BIN_RELEASE $ION_ON  -t jetstream3 1>&2 && $RESULT"
