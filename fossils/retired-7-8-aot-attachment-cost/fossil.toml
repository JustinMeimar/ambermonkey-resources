name = "aot-attachment-cost"
description = "Paired cpstartup runs (runtime codegen vs AOT-installed) comparing per-artifact install cost against runtime compile cost across the three AOT artifact classes: baseline interpreter, baseline scripts, IC stubs."
default_iterations = 10
allow_failure = false
workdir = "."

[analyze]
installs = "analyses/parse_installs.py"

[figures.install-table]
analysis = "installs"
script = "figures/install_table.py"

[variables]
MOZCONFIG = "/home/justin/spidermonkey/ambermonkey/mozconfigs/browser-release-aot.mozconfig"

[variants]
blocked = "python3 scripts/run_block.py --firefox @FIREFOX --binary @BIN_AOT --mozconfig $MOZCONFIG"
