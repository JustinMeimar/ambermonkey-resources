name = "inter-workload"
description = "Inter-workload overlap across the first eight alphabetical TP6 sites: content-process Baseline functions and IC bodies, static Jaccard, directional function-entry and stub-entry coverage."
default_iterations = 1
allow_failure = false

[analyze]
artifact-sets = "analyses/ic_set.py"

[figures.artifact-overlap]
analysis = "artifact-sets"
script   = "figures/ic_jaccard.py"

# All three table emitters read records/ directly and pool per site;
# they share pairwise-intersection helpers in scripts/pairwise.py.
[tables.coverage]
script = "scripts/emit_summary_json.py"

[tables.baseline-static]
script = "scripts/emit_baseline_static_table.py"

[tables.baseline-dynamic]
script = "scripts/emit_baseline_dynamic_table.py"

[variables]
INIT   = "D=$(mktemp -d /tmp/amber-3-3.XXXXXX)"
EMIT   = "python3 /home/justin/spidermonkey/ambermonkey/fossils/3-3-inter-workload/scripts/emit_ranks.py \"$D\" && rm -rf \"$D\""
# --cold makes each cycle a fresh browser process; all three write into $D and pool.
RAPTOR = "cd @FIREFOX && @MC_BROWSER ./mach raptor -t $SITE --binary @BIN_RELEASE --setenv JS_INSTR=lifecycle,ic,demand,baseline --setenv JS_INSTR_DIR=$D --setenv JS_INSTR_MODE=demand --setenv JS_INSTR_RUN_ID=$(basename $D) --setenv @SANDBOX --setenv MOZ_HEADLESS=1 --cold --page-cycles 1 --browser-cycles 3 --post-startup-delay 1000"

[variants]
amazon         = "SITE=amazon;         $INIT && $RAPTOR 1>&2 && $EMIT"
bing-search    = "SITE=bing-search;    $INIT && $RAPTOR 1>&2 && $EMIT"
buzzfeed       = "SITE=buzzfeed;       $INIT && $RAPTOR 1>&2 && $EMIT"
cnn            = "SITE=cnn;            $INIT && $RAPTOR 1>&2 && $EMIT"
ebay           = "SITE=ebay;           $INIT && $RAPTOR 1>&2 && $EMIT"
espn           = "SITE=espn;           $INIT && $RAPTOR 1>&2 && $EMIT"
expedia        = "SITE=expedia;        $INIT && $RAPTOR 1>&2 && $EMIT"
facebook       = "SITE=facebook;       $INIT && $RAPTOR 1>&2 && $EMIT"
