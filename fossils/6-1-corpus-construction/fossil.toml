name = "7-1-aot-corpus-collector"
description = "Record the AOT artifact corpus one tp6 site at a time, plus the self-hosted baseline set. train.txt and test.txt freeze the 24/8 partition."
default_iterations = 1
allow_failure = false

[tables.composition]
script = "scripts/emit_composition.py"

[tables.loso]
script = "scripts/loso.py"

[variables]
# useAOTImage stays off: the recorder must observe the whole compile stream.
INIT      = "rm -rf @CORPUS/$SITE && mkdir -p @CORPUS/$SITE"
RECORD    = "cd @FIREFOX && @MC_AOT ./mach raptor -t $SITE --binary @BIN_AOT --setenv JIT_OPTION_aotRecordDir=@CORPUS/$SITE --setenv @SANDBOX --setenv MOZ_HEADLESS=1 --page-cycles 1 --browser-cycles 1 --post-startup-delay 1000"
EMIT      = "printf '{\"site\":\"%s\",\"blfun\":%s,\"ic\":%s,\"bytes\":%s}\\n' $SITE $(ls @CORPUS/$SITE | grep -c '^blfun-') $(ls @CORPUS/$SITE | grep -c '^ic-') $(du -sb @CORPUS/$SITE | cut -f1)"

# --spectre-mitigations=on is mandatory: the two mitigation bits are fingerprinted
# into every blob; without it the browser refuses to install the recorded image.
SH_RECORD = "rm -rf @SELFHOSTED && @JSSHELL_AOT --spectre-mitigations=on --aot-record=@SELFHOSTED --aot-record-self-hosted -e 'quit(0);'"
SH_EMIT   = "printf '{\"site\":\"self-hosted\",\"blfun\":%s,\"ic\":%s,\"bytes\":%s}\\n' $(ls @SELFHOSTED | grep -c '^blfun-') $(ls @SELFHOSTED | grep -c '^ic-') $(du -sb @SELFHOSTED | cut -f1)"

[variants]
self-hosted    = "$SH_RECORD 1>&2 && $SH_EMIT"
amazon         = "SITE=amazon;         $INIT && $RECORD 1>&2 && $EMIT"
bing-search    = "SITE=bing-search;    $INIT && $RECORD 1>&2 && $EMIT"
buzzfeed       = "SITE=buzzfeed;       $INIT && $RECORD 1>&2 && $EMIT"
cnn            = "SITE=cnn;            $INIT && $RECORD 1>&2 && $EMIT"
ebay           = "SITE=ebay;           $INIT && $RECORD 1>&2 && $EMIT"
