fandom         = "SITE=fandom;         $INIT && $RECORD 1>&2 && $EMIT"
google-docs    = "SITE=google-docs;    $INIT && $RECORD 1>&2 && $EMIT"
google-mail    = "SITE=google-mail;    $INIT && $RECORD 1>&2 && $EMIT"
google-search  = "SITE=google-search;  $INIT && $RECORD 1>&2 && $EMIT"
