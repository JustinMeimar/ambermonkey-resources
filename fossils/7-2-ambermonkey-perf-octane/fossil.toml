name = "7-2-ambermonkey-perf-octane"
description = "Held-out Octane 2 performance across the interpreter, AmberMonkey ablations, and the default JIT."
default_iterations = 3
allow_failure = false

[analyze]
octane-detail = "analyses/parse_octane.py"

[figures.subtest-bars]
analysis = "octane-detail"
script   = "figures/subtest_bars.py"

[figures.octane-ablation-perf]
analysis = "octane-detail"
script   = "figures/octane_ablation_perf.py"

[tables.perf]
analysis = "octane-detail"
script   = "figures/octane_table.py"

[variables]
JS_BASE   = "--wasm-compiler=none"
INTERP    = "--no-jit-backend"
AOT       = "--aot --aot-only --no-native-regexp"
BLINTERP  = "--blinterp-eager --no-baseline --cache-ir-stubs=off --no-native-regexp"
NO_ION    = "--no-ion"
IC_ONLY   = "JIT_OPTION_aotSkipBaselineFn=true"
OCTANE_RUNNER = "$FOSSIL_PROJECT_DIR/$FOSSIL_NAME/scripts/run-no-zlib.js"

[variants]
interp-only    = "cd @OCTANE_DIR && @CLEAN_JIT_ENV          @JSSHELL_AOT $JS_BASE $INTERP           -f \"$OCTANE_RUNNER\""
blinterp-only  = "cd @OCTANE_DIR && @CLEAN_JIT_ENV          @JSSHELL_AOT $JS_BASE $BLINTERP $NO_ION -f \"$OCTANE_RUNNER\""
aot-corpus-ic  = "cd @OCTANE_DIR && @CLEAN_JIT_ENV $IC_ONLY @JSSHELL_AOT $JS_BASE $AOT $NO_ION      -f \"$OCTANE_RUNNER\""
aot-corpus     = "cd @OCTANE_DIR && @CLEAN_JIT_ENV          @JSSHELL_AOT $JS_BASE $AOT $NO_ION      -f \"$OCTANE_RUNNER\""
default-no-ion = "cd @OCTANE_DIR && @CLEAN_JIT_ENV          @JSSHELL_AOT $JS_BASE $NO_ION           -f \"$OCTANE_RUNNER\""
default        = "cd @OCTANE_DIR && @CLEAN_JIT_ENV          @JSSHELL_AOT $JS_BASE                   -f \"$OCTANE_RUNNER\""
