name = "v8-jitless-comparison"
description = "Speedometer 3 and Octane 2 performance retained relative to each engine's default configuration."
default_iterations = 3
allow_failure = false

[analyze]
performance = "analyses/parse_performance.py"

[figures.performance-retained]
analysis = "performance"
script   = "figures/performance_retained.py"

[figures.performance-retained-dots]
analysis = "performance"
script   = "figures/performance_retained_dots.py"

[figures.performance-retained-hbars]
analysis = "performance"
script   = "figures/performance_retained_hbars.py"

[variables]
SM_MACH    = "./mach raptor -t speedometer3 --app firefox --browser-cycles 1 --page-cycles 3 --binary @BIN_AOT --setenv MOZ_HEADLESS=1"
V8_MACH    = "./mach raptor -t speedometer3 --app chrome --browser-cycles 1 --page-cycles 3 --binary @V8_CHROME_NOPGO --browsertime-chromedriver @V8_CHROMEDRIVER --browsertime-arg chrome.args=--headless=new"
V8_JITLESS = "--browsertime-arg chrome.args=--js-flags=--jitless"
ION_OFF    = "--setpref javascript.options.ion=false"
RESULT     = "cat testing/mozharness/build/raptor.json"

AOT      = "JIT_OPTION_useAOTImage=true JIT_OPTION_aotOnly=true"
NO_REGEX = "JIT_OPTION_nativeRegExp=false"

# Octane excludes zlib, whose asm.js path would make the comparison depend on
# wasm compilation.
OCTANE_RUN = "/home/justin/spidermonkey/ambermonkey/fossils/7-2-ambermonkey-perf-octane/scripts/run-no-zlib.js"
OCTANE_CLEAN_ENV = "env -u JIT_OPTION_aotSkipBaselineFn -u JIT_OPTION_useAOTImage -u JIT_OPTION_aotOnly -u JIT_OPTION_aotEnforce -u JIT_OPTION_aotRecordDir -u JIT_OPTION_disableJitBackend -u JIT_OPTION_ion -u JIT_OPTION_baselineJit -u JIT_OPTION_nativeRegExp -u JIT_OPTION_disableCacheIR"
OCTANE_BASE = "@JSSHELL_AOT --wasm-compiler=none"

[variants]
speedometer-am             = "@CLEAN_AOT $AOT $NO_REGEX $SM_MACH $ION_OFF 1>&2 && $RESULT"
speedometer-am-oracle      = "@CLEAN_AOT $AOT $NO_REGEX $SM_MACH $ION_OFF 1>&2 && $RESULT"
speedometer-baseline       = "@CLEAN_AOT      $NO_REGEX $SM_MACH $ION_OFF 1>&2 && $RESULT"
speedometer-default        = "@CLEAN_AOT                $SM_MACH          1>&2 && $RESULT"
speedometer-v8-default     = "cd @FIREFOX && $V8_MACH             1>&2 && $RESULT"
speedometer-v8-jitless     = "cd @FIREFOX && $V8_MACH $V8_JITLESS 1>&2 && $RESULT"

octane-am         = "cd @OCTANE_DIR && $OCTANE_CLEAN_ENV $OCTANE_BASE --aot --aot-only --no-native-regexp --no-ion -f $OCTANE_RUN"
octane-am-oracle  = "cd @OCTANE_DIR && $OCTANE_CLEAN_ENV $OCTANE_BASE --aot --aot-only --no-native-regexp --no-ion -f $OCTANE_RUN"
octane-baseline   = "cd @OCTANE_DIR && $OCTANE_CLEAN_ENV $OCTANE_BASE --no-native-regexp --no-ion -f $OCTANE_RUN"
octane-default    = "cd @OCTANE_DIR && $OCTANE_CLEAN_ENV $OCTANE_BASE -f $OCTANE_RUN"
octane-v8-default = "cd @OCTANE_DIR && @V8_D8 $OCTANE_RUN"
octane-v8-jitless = "cd @OCTANE_DIR && @V8_D8 --jitless $OCTANE_RUN"
