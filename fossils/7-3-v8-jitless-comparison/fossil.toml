name = "v8-jitless-comparison"
description = "Speedometer 3 and Octane 2 restricted performance retained by AmberMonkey and V8 Jitless relative to each engine's default configuration."
default_iterations = 3
allow_failure = false

[analyze]
speedometer-detail = "analyses/parse_speedometer.py"

[figures.jitless-bars]
analysis = "speedometer-detail"
script   = "figures/jitless_bars.py"

[figures.octane-bars]
analysis = "speedometer-detail"
script   = "figures/octane_bars.py"

[tables.jitless-comparison]
analysis = "speedometer-detail"
script   = "figures/comparison_table.py"

[variables]
SM_MACH    = "./mach raptor -t speedometer3 --app firefox --browser-cycles 1 --page-cycles 3 --binary @BIN_AOT --setenv MOZ_HEADLESS=1"
V8_MACH    = "./mach raptor -t speedometer3 --app chrome --browser-cycles 1 --page-cycles 3 --binary @V8_CHROME_NOPGO --browsertime-chromedriver @V8_CHROMEDRIVER --browsertime-arg chrome.args=--headless=new"
V8_JITLESS = "--browsertime-arg chrome.args=--js-flags=--jitless"
V8_JITLESS_NO_IC = "--browsertime-arg 'chrome.args=--js-flags=\"--jitless --no-use-ic\"'"
ION_OFF    = "--setpref javascript.options.ion=false"
RESULT     = "cat testing/mozharness/build/raptor.json"

INTERP  = "JIT_OPTION_disableJitBackend=true"
AOT     = "JIT_OPTION_useAOTImage=true JIT_OPTION_aotOnly=true"
IC_ONLY = "JIT_OPTION_aotSkipBaselineFn=true"
NO_REGEX = "JIT_OPTION_nativeRegExp=false"

# Octane excludes zlib, whose asm.js path would make the comparison depend on
# wasm compilation. V8 runs in the already-built Chromium via ChromeDriver.
OCTANE_RUN = "/home/justin/spidermonkey/ambermonkey/fossils/7-2-ambermonkey-perf-octane/scripts/run-no-zlib.js"
OCTANE_CHROME_RUNNER = "python3 /home/justin/spidermonkey/ambermonkey/fossils/7-3-v8-jitless-comparison/scripts/run_octane_chrome.py --chrome @V8_CHROME_NOPGO --chromedriver @V8_CHROMEDRIVER --octane-dir @OCTANE_DIR"
OCTANE_CLEAN_ENV = "env -u JIT_OPTION_aotSkipBaselineFn -u JIT_OPTION_useAOTImage -u JIT_OPTION_aotOnly -u JIT_OPTION_aotEnforce -u JIT_OPTION_aotRecordDir -u JIT_OPTION_disableJitBackend -u JIT_OPTION_ion -u JIT_OPTION_baselineJit -u JIT_OPTION_nativeRegExp -u JIT_OPTION_disableCacheIR"
OCTANE_SM = "@JSSHELL_AOT --wasm-compiler=none --aot --aot-only --no-native-regexp --no-ion -f $OCTANE_RUN"

[variants]
interp-only    = "@CLEAN_AOT $INTERP                   $SM_MACH          1>&2 && $RESULT"
aot-corpus-ic  = "@CLEAN_AOT $AOT $IC_ONLY $NO_REGEX $SM_MACH $ION_OFF 1>&2 && $RESULT"
aot-corpus     = "@CLEAN_AOT $AOT          $NO_REGEX $SM_MACH $ION_OFF 1>&2 && $RESULT"
default-no-ion = "@CLEAN_AOT                         $SM_MACH $ION_OFF 1>&2 && $RESULT"
default        = "@CLEAN_AOT                         $SM_MACH          1>&2 && $RESULT"
v8-default     = "cd @FIREFOX && $V8_MACH                              1>&2 && $RESULT"
v8-jitless     = "cd @FIREFOX && $V8_MACH $V8_JITLESS                  1>&2 && $RESULT"
v8-jitless-no-ic = "cd @FIREFOX && $V8_MACH $V8_JITLESS_NO_IC 1>&2 && $RESULT"

# The V8 pair is ready to bury. The optional AM-Oracle variant assumes the
# AOT shell was linked with an Octane-specific corpus before it is buried.
octane-v8-default = "$OCTANE_CHROME_RUNNER"
octane-v8-jitless = "$OCTANE_CHROME_RUNNER --jitless"
octane-am-oracle  = "cd @OCTANE_DIR && $OCTANE_CLEAN_ENV $OCTANE_SM"
