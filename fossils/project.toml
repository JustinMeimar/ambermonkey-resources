name = "ambermonkey"
description = "AmberMonkey: AOT Baseline JIT sharing"
artifact_dir = "../paper/lib/artifacts"

[constants]
FIREFOX = "$FOSSIL_PROJECT_DIR/../../firefox"
BIN_RELEASE = "$FIREFOX/build-browser-release/dist/bin/firefox"
BIN_AOT = "$FIREFOX/build-browser-release-aot/dist/bin/firefox"
JSSHELL_AOT = "$FIREFOX/build-shell-release-aot/dist/bin/js"
JSSHELL_RIT = "$FIREFOX/js-perf-eval-rit"
JSSHELL_NATIVE_LINKER = "$FIREFOX/js-perf-eval-native-linker"
JSSHELL_NATIVE_LINKER_VALUE_MIRROR = "$FIREFOX/js-perf-eval-native-linker-value-mirror"

MOZCONFIG_RELEASE = "MOZCONFIG=$FOSSIL_PROJECT_DIR/../mozconfigs/browser-release.mozconfig"
MOZCONFIG_AOT = "MOZCONFIG=$FOSSIL_PROJECT_DIR/../mozconfigs/browser-release-aot.mozconfig"
NO_CONTENT_SANDBOX_ENV = "MOZ_DISABLE_CONTENT_SANDBOX=1"
CLEAN_JIT_ENV = "env -u MOZ_HEADLESS -u IONFLAGS -u JIT_OPTION_aotEnforce -u JIT_OPTION_aotOnly -u JIT_OPTION_aotRecordDir -u JIT_OPTION_aotSelfHostedBaselineOnly -u JIT_OPTION_aotSkipBaselineFn -u JIT_OPTION_baselineInterpreterWarmUpThreshold -u JIT_OPTION_baselineJit -u JIT_OPTION_disableCacheIR -u JIT_OPTION_disableJitBackend -u JIT_OPTION_ion -u JIT_OPTION_useAOTBaseline -u JIT_OPTION_useAOTIC -u JIT_OPTION_useAOTImage -u JIT_OPTION_nativeRegExp"
AOT_BROWSER = "cd $FIREFOX && $CLEAN_JIT_ENV $NO_CONTENT_SANDBOX_ENV $MOZCONFIG_AOT"

S3_RAPTOR = "./mach raptor -t speedometer3 --app firefox --browser-cycles 1 --page-cycles 3 --binary $BIN_AOT --setenv MOZ_HEADLESS=1"
RAPTOR_RESULT = "cat testing/mozharness/build/raptor.json"
AOT_ONLY_ENV = "JIT_OPTION_useAOTImage=true JIT_OPTION_aotOnly=true"
AOT_ONLY_SETENV = "--setenv JIT_OPTION_useAOTImage=true --setenv JIT_OPTION_aotOnly=true"
NO_ION_PREF = "--setpref javascript.options.ion=false"
NO_REGEX_ENV = "JIT_OPTION_nativeRegExp=false"
NO_REGEX_SETENV = "--setenv JIT_OPTION_nativeRegExp=false"

SCRATCH = "/tmp"
CORPUS = "/tmp/amber-aot-corpus"
SELFHOSTED = "/tmp/amber-aot-selfhosted"
SELECTED_CORPUS = "/tmp/amber-aot-corpus-selected"
OCTANE_DIR = "$FIREFOX/js/src/octane"
