name = "ambermonkey"
description = "AmberMonkey: AOT Baseline JIT sharing"
paper_dir = "/home/justin/spidermonkey/ambermonkey/paper/lib/json"

[constants]
FIREFOX = "/home/justin/spidermonkey/firefox"
JSSHELL = "$FIREFOX/build-shell-release/dist/bin/js"
JSSHELL_AOT = "$FIREFOX/build-shell-release-aot/dist/bin/js"
BIN_RELEASE = "$FIREFOX/build-browser-release/dist/bin/firefox"
BIN_AOT = "$FIREFOX/build-browser-release-aot/dist/bin/firefox"
V8_CHROME_NOPGO = "/home/justin/spidermonkey/ambermonkey/v8-project/run-chromium-nixos.sh"
V8_CHROMEDRIVER = "/home/justin/spidermonkey/ambermonkey/v8-project/run-chromedriver-nixos.sh"
MC_BROWSER = "MOZCONFIG=/home/justin/spidermonkey/ambermonkey/mozconfigs/browser-release.mozconfig"
MC_AOT = "MOZCONFIG=/home/justin/spidermonkey/ambermonkey/mozconfigs/browser-release-aot.mozconfig"
SANDBOX = "MOZ_DISABLE_CONTENT_SANDBOX=1"
# cd into firefox, strip ambient JIT env so --setenv is authoritative, apply @SANDBOX + @MC_AOT.
CLEAN_AOT = "cd $FIREFOX && env -u MOZ_HEADLESS -u IONFLAGS -u JIT_OPTION_aotEnforce -u JIT_OPTION_aotOnly -u JIT_OPTION_aotRecordDir -u JIT_OPTION_aotSelfHostedBaselineOnly -u JIT_OPTION_aotSkipBaselineFn -u JIT_OPTION_baselineInterpreterWarmUpThreshold -u JIT_OPTION_baselineJit -u JIT_OPTION_disableCacheIR -u JIT_OPTION_disableJitBackend -u JIT_OPTION_ion -u JIT_OPTION_useAOTBaseline -u JIT_OPTION_useAOTIC -u JIT_OPTION_useAOTImage -u JIT_OPTION_nativeRegExp $SANDBOX $MC_AOT"
CORPUS = "/tmp/amber-aot-corpus"
SELFHOSTED = "/tmp/amber-aot-selfhosted"
TESTS_DIR = "/home/justin/spidermonkey/tests"
OCTANE_DIR = "$FIREFOX/js/src/octane"
