name = "7-5-indirection-e2e-s3"
description = "Speedometer 3 indirection overhead with Ion and native RegExp disabled."
default_iterations = 10
allow_failure = false

[analyze]
speedometer-detail = "analyses/parse_speedometer.py"

[tables.perf]
analysis = "speedometer-detail"
script   = "figures/perf_table.py"

[variants]
default-no-ion = "@AOT_BROWSER         @NO_REGEX_ENV @S3_RAPTOR @NO_ION_PREF 1>&2 && @RAPTOR_RESULT"
aot-corpus     = "@AOT_BROWSER @AOT_ONLY_ENV @NO_REGEX_ENV @S3_RAPTOR @NO_ION_PREF 1>&2 && @RAPTOR_RESULT"
