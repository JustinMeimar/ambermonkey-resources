name = "aot-attachment-cost"
description = "Per-artifact AOT installation and runtime-codegen costs during cpstartup under the current matched execution configurations."
default_iterations = 10
allow_failure = false

[analyze]
timing = "analyses/parse_timing.py"

[tables.attachment]
analysis = "timing"
script = "figures/attachment_table.py"

[variables]
CPSTARTUP = "JIT_OPTION_ion=false JIT_OPTION_nativeRegExp=false ./mach talos-test -a cpstartup"
AOT = "JIT_OPTION_useAOTImage=true JIT_OPTION_aotOnly=true"
# Explicit component selection keeps aotOnly from enabling Baseline bodies.
AOT_IC = "JIT_OPTION_useAOTIC=true JIT_OPTION_aotOnly=true"

[variants]
default-no-ion = "@CLEAN_AOT JS_AOT_TIMING=1         $CPSTARTUP 2>&1"
aot-corpus-ic  = "@CLEAN_AOT JS_AOT_TIMING=1 $AOT_IC $CPSTARTUP 2>&1"
aot-corpus     = "@CLEAN_AOT JS_AOT_TIMING=1 $AOT    $CPSTARTUP 2>&1"
