name = "jetstream3-startup"
description = "First-iteration latency for JetStream 3's startup workloads under matched Baseline JIT and AmberMonkey configurations."
default_iterations = 30
allow_failure = false

[analyze]
startup = "analyses/parse_startup.py"

[figures.startup-bars]
analysis = "startup"
script = "figures/startup_bars.py"

[tables.startup]
analysis = "startup"
script = "figures/startup_table.py"

[variables]
MACH = "JIT_OPTION_nativeRegExp=false ./mach raptor -t jetstream3 --binary @BIN_AOT --browser-cycles 1 --page-cycles 1 --post-startup-delay 1000 --setenv MOZ_HEADLESS=1 --setpref javascript.options.ion=false --setpref javascript.options.wasm=false --test-url-params 'tags=startup&iterationCount=2&worstCaseCount=1'"

AOT = "JIT_OPTION_useAOTImage=true JIT_OPTION_aotOnly=true"
AOT_IC = "JIT_OPTION_useAOTIC=true JIT_OPTION_aotOnly=true"
RESULT = "cat testing/mozharness/build/raptor.json"

[variants]
default-no-ion = "@CLEAN_AOT         $MACH 1>&2 && $RESULT"
aot-corpus-ic  = "@CLEAN_AOT $AOT_IC $MACH 1>&2 && $RESULT"
aot-corpus     = "@CLEAN_AOT $AOT    $MACH 1>&2 && $RESULT"
