name = "cross-process-memory-octane"
description = "Per-process peak RSS and private-anonymous RSS of jsshell running one Octane sub-benchmark. Five configs: interp, baseline, stock, aot, aot-only."
default_iterations = 3
allow_failure = false

[analyze]
memory = "analyses/parse_memory.py"

[figures.anon-exec-bars]
analysis = "memory"
script   = "figures/anon_exec_bars.py"

[tables.octane-jit]
analysis = "memory"
script   = "figures/memory_table.py"

[tables.octane-rss]
analysis = "memory"
script   = "figures/memory_table.py"

[tables.octane-anon]
analysis = "memory"
script   = "figures/memory_table.py"

[variables]
MEASURE  = "python3 /home/justin/spidermonkey/ambermonkey/fossils/retired-7-5-cross-process-memory-octane/scripts/measure_memory.py"
INTERP   = "--no-jit-backend"
BASELINE = "--no-ion"
STOCK    = ""
AOT      = "--aot"
AOT_ONLY = "--aot --aot-only"

[variants]
richards-interp        = "cd @OCTANE_DIR && $MEASURE @JSSHELL_AOT $INTERP   -f run-richards.js"
richards-baseline      = "cd @OCTANE_DIR && $MEASURE @JSSHELL_AOT $BASELINE -f run-richards.js"
richards-stock         = "cd @OCTANE_DIR && $MEASURE @JSSHELL_AOT $STOCK    -f run-richards.js"
richards-aot           = "cd @OCTANE_DIR && $MEASURE @JSSHELL_AOT $AOT      -f run-richards.js"
richards-aot-only      = "cd @OCTANE_DIR && $MEASURE @JSSHELL_AOT $AOT_ONLY -f run-richards.js"
