name = "indirection-overhead"
description = "User-mode cycle cost of jsshell hot loops across Baseline JIT and three AmberMonkey indirection-ablation build states: RIT only, native linker, and native linker plus value mirroring."
default_iterations = 30
allow_failure = false

[analyze]
cycles = "analyses/parse_cycles.py"

[figures.cycles-bars]
analysis = "cycles"
script   = "figures/cycles_bars.py"

[figures.cycles-hbars]
analysis = "cycles"
script   = "figures/cycles_hbars.py"

# Bypasses parse_cycles.py (which refuses when any observation has empty stdout)
# so the table survives legacy records where perf produced no JSON.
[tables.cycles]
script = "scripts/emit_cycles_table.py"

[variables]
JSSHELL_DEFAULT       = "@FIREFOX/build-shell-release/dist/bin/js"
JSSHELL_AM            = "@FIREFOX/build-shell-release-aot/dist/bin/js"
BENCH_INTERRUPT_CHECK = "/home/justin/spidermonkey/ambermonkey/fossils/7-4-indirection-overhead/microbenches/interrupt_check.js"
BENCH_STACK_CHECK     = "/home/justin/spidermonkey/ambermonkey/fossils/7-4-indirection-overhead/microbenches/stack_check.js"
BENCH_PREBARRIER      = "/home/justin/spidermonkey/ambermonkey/fossils/7-4-indirection-overhead/microbenches/prebarrier.js"
BENCH_VM_CALL         = "/home/justin/spidermonkey/ambermonkey/fossils/7-4-indirection-overhead/microbenches/vm_call.js"
BENCH_ABI_CALL        = "/home/justin/spidermonkey/ambermonkey/fossils/7-4-indirection-overhead/microbenches/abi_call.js"
BENCH_ARITH           = "/home/justin/spidermonkey/ambermonkey/fossils/7-4-indirection-overhead/microbenches/arith.js"
BENCH_PROP_LOAD       = "/home/justin/spidermonkey/ambermonkey/fossils/7-4-indirection-overhead/microbenches/prop_load.js"
BENCH_ARRAY_LOAD      = "/home/justin/spidermonkey/ambermonkey/fossils/7-4-indirection-overhead/microbenches/array_load.js"
FLAGS_AOT             = "--aot --blinterp-eager --aot-only"
FLAGS_DEFAULT         = "--blinterp-eager --no-ion"
INIT                  = "T=$(mktemp /tmp/amber-7-4.XXXXXX.json)"
RUN                   = "perf stat --output=$T -j -e cycles:u,instructions:u,ref-cycles:u"
EMIT                  = "STATUS=$?; cat $T; rm -f $T; exit $STATUS"

[variants]
interrupt-check-default = "$INIT; $RUN $JSSHELL_DEFAULT $FLAGS_DEFAULT -f $BENCH_INTERRUPT_CHECK 1>&2; $EMIT"
interrupt-check-rit-only = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_INTERRUPT_CHECK 1>&2; $EMIT"
interrupt-check-native-linker = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_INTERRUPT_CHECK 1>&2; $EMIT"
interrupt-check-native-linker-value-mirror = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_INTERRUPT_CHECK 1>&2; $EMIT"
stack-check-default     = "$INIT; $RUN $JSSHELL_DEFAULT $FLAGS_DEFAULT -f $BENCH_STACK_CHECK     1>&2; $EMIT"
stack-check-rit-only    = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_STACK_CHECK 1>&2; $EMIT"
stack-check-native-linker = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_STACK_CHECK 1>&2; $EMIT"
stack-check-native-linker-value-mirror = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_STACK_CHECK 1>&2; $EMIT"
prebarrier-default      = "$INIT; $RUN $JSSHELL_DEFAULT $FLAGS_DEFAULT -f $BENCH_PREBARRIER      1>&2; $EMIT"
prebarrier-rit-only     = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_PREBARRIER 1>&2; $EMIT"
prebarrier-native-linker = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_PREBARRIER 1>&2; $EMIT"
prebarrier-native-linker-value-mirror = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_PREBARRIER 1>&2; $EMIT"
vm-call-default         = "$INIT; $RUN $JSSHELL_DEFAULT $FLAGS_DEFAULT -f $BENCH_VM_CALL         1>&2; $EMIT"
vm-call-rit-only        = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_VM_CALL 1>&2; $EMIT"
vm-call-native-linker   = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_VM_CALL 1>&2; $EMIT"
vm-call-native-linker-value-mirror = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_VM_CALL 1>&2; $EMIT"
abi-call-default        = "$INIT; $RUN $JSSHELL_DEFAULT $FLAGS_DEFAULT -f $BENCH_ABI_CALL        1>&2; $EMIT"
abi-call-rit-only       = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_ABI_CALL 1>&2; $EMIT"
abi-call-native-linker  = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_ABI_CALL 1>&2; $EMIT"
abi-call-native-linker-value-mirror = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_ABI_CALL 1>&2; $EMIT"
arith-default           = "$INIT; $RUN $JSSHELL_DEFAULT $FLAGS_DEFAULT -f $BENCH_ARITH           1>&2; $EMIT"
arith-rit-only          = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_ARITH 1>&2; $EMIT"
arith-native-linker     = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_ARITH 1>&2; $EMIT"
arith-native-linker-value-mirror = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_ARITH 1>&2; $EMIT"
prop-load-default       = "$INIT; $RUN $JSSHELL_DEFAULT $FLAGS_DEFAULT -f $BENCH_PROP_LOAD       1>&2; $EMIT"
prop-load-rit-only      = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_PROP_LOAD 1>&2; $EMIT"
prop-load-native-linker = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_PROP_LOAD 1>&2; $EMIT"
prop-load-native-linker-value-mirror = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_PROP_LOAD 1>&2; $EMIT"
array-load-default      = "$INIT; $RUN $JSSHELL_DEFAULT $FLAGS_DEFAULT -f $BENCH_ARRAY_LOAD      1>&2; $EMIT"
array-load-rit-only     = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_ARRAY_LOAD 1>&2; $EMIT"
array-load-native-linker = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_ARRAY_LOAD 1>&2; $EMIT"
array-load-native-linker-value-mirror = "$INIT; $RUN $JSSHELL_AM $FLAGS_AOT -f $BENCH_ARRAY_LOAD 1>&2; $EMIT"
