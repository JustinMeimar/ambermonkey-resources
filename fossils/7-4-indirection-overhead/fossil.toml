name = "indirection-overhead"
description = "User-mode cycle and retired-instruction cost of jsshell hot loops across Baseline JIT and three AmberMonkey indirection-ablation build states: RIT only, RIT plus native linker, and RIT plus native linker plus value mirroring."
default_iterations = 50
allow_failure = false

[analyze]
cycles = "analyses/parse_cycles.py"

[figures.cycles-bars]
analysis = "cycles"
script   = "figures/cycles_bars.py"

[figures.cycles-hbars]
analysis = "cycles"
script   = "figures/cycles_hbars.py"

[figures.instruction-overhead]
analysis = "cycles"
script   = "figures/instruction_overhead.py"

[tables.cycles]
analysis = "cycles"
script   = "figures/cycles_table.py"

[variables]
JSSHELL_BASELINE                   = "@FIREFOX/js-perf-eval-native-linker-value-mirror"
JSSHELL_RIT                        = "@FIREFOX/js-perf-eval-rit"
JSSHELL_NATIVE_LINKER              = "@FIREFOX/js-perf-eval-native-linker"
JSSHELL_NATIVE_LINKER_VALUE_MIRROR = "@FIREFOX/js-perf-eval-native-linker-value-mirror"
RUN_ALL                            = "bash /home/justin/spidermonkey/ambermonkey/fossils/7-4-indirection-overhead/scripts/run_all_microbenches.sh"
FLAGS_AOT                          = "--blinterp-eager --aot --aot-enforce --no-ion"
FLAGS_DEFAULT                      = "--blinterp-eager --no-ion"

[variants]
baseline-jit = "$RUN_ALL $JSSHELL_BASELINE $FLAGS_DEFAULT"
am-rit       = "$RUN_ALL $JSSHELL_RIT $FLAGS_AOT"
am-rit-nl    = "$RUN_ALL $JSSHELL_NATIVE_LINKER $FLAGS_AOT"
am-rit-nl-vm = "$RUN_ALL $JSSHELL_NATIVE_LINKER_VALUE_MIRROR $FLAGS_AOT"
