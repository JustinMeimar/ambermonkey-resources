name = "0-3-navbench-ion-recurrence"
description = "Whether Ion compilations in one nav-bench session recur across runtimes and processes, and compile to the same body."
default_iterations = 3
allow_failure = false

[variants]
navbench = "record.py"
workspace-shuffle = "record.py"
media-pinball = "record.py"
wiki-rabbit-hole = "record.py"
cake-quest = "record.py"
compiler-coffee = "record.py"
debugging-detour = "record.py"
headline-hop = "record.py"
comparison-cart = "record.py"
weekend-wayfinder = "record.py"
paper-trail = "record.py"

[analyses]
recurrence = "analyze.py"

[artifacts.recurrence]
script = "emit_recurrence.py"
analysis = "recurrence"

[artifacts.template-distribution]
script = "emit_template_distribution.py"
analysis = "recurrence"
