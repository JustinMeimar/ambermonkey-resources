name = "shell-memory-scaling"
description = "Per-runtime private JIT memory of the jsshell with N in-process worker JSRuntimes. Four configs at each N: stock-base (--no-ion), stock-full (default), aot-restricted (--aot --aot-only --no-ion), aot-full (--aot)."
default_iterations = 3
allow_failure = false

[analyze]
rss = "analyses/parse_rss.py"

[figures.rss-scaling]
analysis = "rss"
script = "figures/rss_scaling.py"

[tables.scaling-jit]
analysis = "rss"
script = "figures/memory_table.py"

[tables.scaling-rss]
analysis = "rss"
script = "figures/memory_table.py"

[variables]
BENCH          = "@TESTS_DIR/worker_realistic.js"
STOCK_BASE     = "--no-ion"
STOCK_FULL     = ""
AOT_RESTRICTED = "--aot --aot-only --no-ion"
AOT_FULL       = "--aot"
TIME           = "python3 /home/justin/spidermonkey/ambermonkey/fossils/retired-7-6-shell-memory-scaling/scripts/measure_peak_rss.py"

[variants]
n1-stock-base       = "$TIME @JSSHELL_AOT $STOCK_BASE     -f $BENCH -- 1"
n1-stock-full       = "$TIME @JSSHELL_AOT $STOCK_FULL     -f $BENCH -- 1"
n1-aot-restricted   = "$TIME @JSSHELL_AOT $AOT_RESTRICTED -f $BENCH -- 1"
n1-aot-full         = "$TIME @JSSHELL_AOT $AOT_FULL       -f $BENCH -- 1"
n4-stock-base       = "$TIME @JSSHELL_AOT $STOCK_BASE     -f $BENCH -- 4"
n4-stock-full       = "$TIME @JSSHELL_AOT $STOCK_FULL     -f $BENCH -- 4"
n4-aot-restricted   = "$TIME @JSSHELL_AOT $AOT_RESTRICTED -f $BENCH -- 4"
n4-aot-full         = "$TIME @JSSHELL_AOT $AOT_FULL       -f $BENCH -- 4"
n16-stock-base      = "$TIME @JSSHELL_AOT $STOCK_BASE     -f $BENCH -- 16"
n16-stock-full      = "$TIME @JSSHELL_AOT $STOCK_FULL     -f $BENCH -- 16"
n16-aot-restricted  = "$TIME @JSSHELL_AOT $AOT_RESTRICTED -f $BENCH -- 16"
n16-aot-full        = "$TIME @JSSHELL_AOT $AOT_FULL       -f $BENCH -- 16"
n64-stock-base      = "$TIME @JSSHELL_AOT $STOCK_BASE     -f $BENCH -- 64"
n64-stock-full      = "$TIME @JSSHELL_AOT $STOCK_FULL     -f $BENCH -- 64"
n64-aot-restricted  = "$TIME @JSSHELL_AOT $AOT_RESTRICTED -f $BENCH -- 64"
n64-aot-full        = "$TIME @JSSHELL_AOT $AOT_FULL       -f $BENCH -- 64"
n128-stock-base     = "$TIME @JSSHELL_AOT $STOCK_BASE     -f $BENCH -- 128"
n128-stock-full     = "$TIME @JSSHELL_AOT $STOCK_FULL     -f $BENCH -- 128"
n128-aot-restricted = "$TIME @JSSHELL_AOT $AOT_RESTRICTED -f $BENCH -- 128"
n128-aot-full       = "$TIME @JSSHELL_AOT $AOT_FULL       -f $BENCH -- 128"
n256-stock-base     = "$TIME @JSSHELL_AOT $STOCK_BASE     -f $BENCH -- 256"
n256-stock-full     = "$TIME @JSSHELL_AOT $STOCK_FULL     -f $BENCH -- 256"
n256-aot-restricted = "$TIME @JSSHELL_AOT $AOT_RESTRICTED -f $BENCH -- 256"
n256-aot-full       = "$TIME @JSSHELL_AOT $AOT_FULL       -f $BENCH -- 256"
