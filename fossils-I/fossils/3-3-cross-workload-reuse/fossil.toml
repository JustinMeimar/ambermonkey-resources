name = "3-3-cross-workload-reuse"
description = "Static and dynamic intersection from cumulative tp6-Train prefixes to held-out tp6-Test for content-process Baseline functions and IC bodies."
default_iterations = 1
allow_failure = false

[variants]
amazon = "run.py"
bing-search = "run.py"
buzzfeed = "run.py"
cnn = "run.py"
