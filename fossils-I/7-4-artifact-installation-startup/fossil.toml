name = "7-4-artifact-installation-startup"
description = "First-iteration latency for JetStream 3's startup workloads under matched Baseline JIT and AmberMonkey configurations."
default_iterations = 30
allow_failure = false

[analyze]
startup = "analyses/parse_startup.py"

[artifacts.startup-bars]
format = "pdf"
analysis = "startup"
script = "figures/startup_bars.py"

[artifacts.startup]
format = "json"
analysis = "startup"
script = "figures/startup_table.py"

[variables]
MACH = "@NO_REGEX_ENV ./mach raptor -t jetstream3 --binary @BIN_AOT --browser-cycles 1 --page-cycles 1 --post-startup-delay 1000 --setenv MOZ_HEADLESS=1 @NO_ION_PREF --setpref javascript.options.wasm=false --test-url-params 'tags=startup&iterationCount=2&worstCaseCount=1'"

AOT_IC = "JIT_OPTION_useAOTIC=true JIT_OPTION_aotOnly=true"

[variants]
default-no-ion = "@AOT_BROWSER         $MACH 1>&2 && @RAPTOR_RESULT"
aot-corpus-ic  = "@AOT_BROWSER $AOT_IC $MACH 1>&2 && @RAPTOR_RESULT"
aot-corpus     = "@AOT_BROWSER @AOT_ONLY_ENV $MACH 1>&2 && @RAPTOR_RESULT"
