name = "7-2-ambermonkey-perf-s3"
description = "Speedometer 3 performance across the interpreter, AmberMonkey ablations, and the default JIT."
default_iterations = 3
allow_failure = true

[analyze]
speedometer-detail = "analyses/parse_speedometer.py"

[artifacts.subtest-bars]
format = "pdf"
analysis = "speedometer-detail"
script   = "figures/subtest_bars.py"

[artifacts.tier-throughput]
format = "pdf"
analysis = "speedometer-detail"
script   = "figures/tier_throughput.py"

[artifacts.s3-ablation-perf]
format = "pdf"
analysis = "speedometer-detail"
script   = "figures/s3_ablation_perf.py"

[artifacts.aot-tradeoff]
format = "pdf"
analysis = "speedometer-detail"
script   = "figures/aot_tradeoff.py"

[artifacts.perf]
format = "json"
analysis = "speedometer-detail"
script   = "figures/speedometer_table.py"

[variables]
INTERP   = "JIT_OPTION_disableJitBackend=true"
IC_ONLY  = "JIT_OPTION_aotSkipBaselineFn=true"
BLINTERP = "JIT_OPTION_baselineJit=false JIT_OPTION_disableCacheIR=true JIT_OPTION_baselineInterpreterWarmUpThreshold=0"

[variants]
interp-only    = "@AOT_BROWSER $INTERP                          @S3_RAPTOR              1>&2 && @RAPTOR_RESULT"
blinterp-only  = "@AOT_BROWSER $BLINTERP           @NO_REGEX_ENV @S3_RAPTOR @NO_ION_PREF 1>&2 && @RAPTOR_RESULT"
aot-corpus-ic  = "@AOT_BROWSER @AOT_ONLY_ENV $IC_ONLY    @NO_REGEX_ENV @S3_RAPTOR @NO_ION_PREF 1>&2 && @RAPTOR_RESULT"
aot-corpus     = "@AOT_BROWSER @AOT_ONLY_ENV             @NO_REGEX_ENV @S3_RAPTOR @NO_ION_PREF 1>&2 && @RAPTOR_RESULT"
default-no-ion = "@AOT_BROWSER                                @S3_RAPTOR @NO_ION_PREF 1>&2 && @RAPTOR_RESULT"
default        = "@AOT_BROWSER                                @S3_RAPTOR              1>&2 && @RAPTOR_RESULT"
